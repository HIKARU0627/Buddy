        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/memory/forget-plans:
    post:
      operationId: createForgetPlan
      summary: 記憶の忘却の計画
      description: 本人がロック解除済みの画面で選んだ記憶 1 件について、中枢が忘却の計画（消える物・消える指示・残る物）を作って返す（B06-07b-2、ADR 0180）。消える本人の指示は本文（データ鍵で開いた 200 文字まで）を付けて返し、開けない指示は本文を null にして計画に残す（U433、ADR 0185）。この時点では何も消さない。端末は記憶の ID だけを送る。忘却の公開ゲート（U112）が閉じている間は 503 で、計画も作らない（ゲートを開けるのは忘却の画面の PR だけ。2026-10-31 Q1）。対象の記憶がなければ 409。台帳の HMAC の鍵がない（バックアップの設定の前）・消える指示があるのにデータ鍵を読めない・計画が上限を超える・系譜が読めないときは 503。計画は要求した端末に結び付き、10 分で無効になる。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
      parameters:
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/ForgetPlanRequest
      responses:
        '200':
          description: 本人が確かめる忘却の計画。
          content:
