<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddy</title>
    <!--
      React Aria（HeroUI の Button など）は、この id の要素がなければ <style> を head に差し込む。
      CSP の style-src 'self' はそれを止めるため、同じ規則を styles.css に置き、この空の要素で差し込みを省かせる（ADR 0024）。
    -->
    <template id="react-aria-pressable-style"></template>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
