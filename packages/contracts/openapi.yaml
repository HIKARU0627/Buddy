  /v1/events/stream:
    get:
      operationId: streamEvents
      summary: イベントの購読（WSS）
      description: WebSocket へ切り替え、EventStreamMessage を流す。認証はヘッダーで行い、秘密を URL クエリーに入れない。開始位置はクエリーの cursor（getSnapshot・getEvents・イベントが返した値）で、その後の COMMIT 済みのイベントを順に流す。中枢が発行した形でない cursor は切り替えずに 422。接続は端末の今の接続範囲（getBootstrap で発行したもの）に結び付き、なければすぐに閉じる。DB 世代の変化・履歴期限・接続範囲の失効（再接続・期限）では resnapshot_required を送って閉じる。端末の失効・自宅判定の不成立でも理由つきで閉じる。同じ端末の同時の購読は上限（4）までで、超えれば切り替えずに 429、同時の切り替えで後から開いたものは理由つきで閉じる。キャンバスの記述が新しい版になったときは canvas の知らせ（版だけ。cursor を持たず、記録に入れない）を購読に送り、端末は getCanvas で取る（ADR 0032）。期限切れ・忘却・忘却台帳の前進の知らせは notice（ID と理由と番号だけ。cursor を持たず、記録に入れず、再送しない）として、接続範囲を確かめた後の購読に送る（UI-05 の段階 3、ADR 0187）。中枢は ping を送り、応答のない接続を切る。閉じるコードは x-buddy-websocket-close-codes（07 §2・§4、ADR 0009・0023）。
      x-buddy-core-checks: *id001
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '101':
          description: WebSocket へ切り替えた。以降のメッセージは x-buddy-websocket-message の形式。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-buddy-websocket-message:
        $ref: ./schemas/buddy.schema.json#/$defs/EventStreamMessage
      x-buddy-websocket-close-codes:
        '4410': resnapshot_required を送った後（理由は store_generation_changed・history_expired・scope_expired）。スナップショットを取り直して接続し直す
        '4401': 端末の失効（device_revoked）。再登録が必要
        '4403': 自宅判定の不成立（outside_home_network）
        '1001': 中枢の停止（core_stopping）。cursor から接続し直す
        '1003': 端末からメッセージを受け取った（unsupported_data）。端末から送るメッセージは定義していない
        '1011': 中枢の DB を読めない（dependency_unavailable）
        '1013': 送り先の詰まり（slow_consumer）。cursor から接続し直す
        '4429': 同じ端末の同時の購読の数の上限（too_many_streams）。開いている購読を閉じてから接続し直す
