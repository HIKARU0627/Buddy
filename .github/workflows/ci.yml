name: CI

on:
  push:
    branches: [main]
  pull_request:
  public:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Public content / secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:setup
      - run: pnpm run security:check
      - run: pnpm run security:scan
      - name: Public repository history gate
        if: github.event.repository.private == false
        run: pnpm run public:check

  # OS ごとの全検査は verify-os.yml（試験を shard に分けて並列に実行）。
  test-ubuntu:
    name: Test (ubuntu-latest)
    uses: ./.github/workflows/verify-os.yml
    with:
      os: ubuntu-latest

  test-windows:
    name: Test (windows-latest)
    uses: ./.github/workflows/verify-os.yml
    with:
      os: windows-latest

  test-macos:
    name: Test (macos-latest)
    uses: ./.github/workflows/verify-os.yml
    with:
      os: macos-latest

  # 記録の現在性（G1/G4）の strict な照合。main への push でだけ知らせる。
  # 必須チェック（`Verify (<os>)`・`Public content / secrets`）には含めないので、main の記録が
  # 一時的に古い間も PR のマージは止まらない。証拠の生成は verify-os.yml の macOS shard 2/3 が行う。
  evidence-identity:
    name: Evidence identity (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check committed evidence against main
        run: pnpm run evidence:check

  # main の ruleset が必須とする `Verify (<os>)` の名前。その OS の全 shard が成功したときだけ成功する。
  # 上流が失敗・取り消し・スキップのときも always() で必ず走り、失敗にする。
  verify-ubuntu:
    name: Verify (ubuntu-latest)
    needs: [test-ubuntu]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all ubuntu-latest shards to succeed
        env:
          RESULT: ${{ needs.test-ubuntu.result }}
        run: |
          echo "test-ubuntu: $RESULT"
          test "$RESULT" = "success"

  verify-windows:
    name: Verify (windows-latest)
    needs: [test-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all windows-latest shards to succeed
        env:
          RESULT: ${{ needs.test-windows.result }}
        run: |
          echo "test-windows: $RESULT"
          test "$RESULT" = "success"

  verify-macos:
    name: Verify (macos-latest)
    needs: [test-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all macos-latest shards to succeed
        env:
          RESULT: ${{ needs.test-macos.result }}
        run: |
          echo "test-macos: $RESULT"
          test "$RESULT" = "success"
