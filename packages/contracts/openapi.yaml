openapi: 3.1.2
info:
  title: Buddy Core HTTP API (B00)
  version: 1.0.0
  description: 設計 07 §2 の経路と、端末の登録・失効・連携の接続（U10、ADR 0009）、予算の利用状況・超過枠の承認・M 超過の確認・不明な費用の手での精算（ADR 0034）。形式は OpenAPI と JSON Schema が正本で、認証・自宅判定・接続範囲・ロック・画面操作・音声所有権・版の検査は x-buddy-core-checks の順に Core が行う（domain の api.ts）。対象の存在・所有・状態遷移の可否はその後に domain の各規則で判定する。サーバー実装・DB transaction は未実装。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security:
  - deviceToken: []
paths:
  /v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: 接続情報の取得
      description: 認証後に API 版・端末能力・DB 世代・中枢の起動 ID・接続範囲・入出力の状態を返す。本文は含めない。端末は api_version の major が合わなければ使わない（07 §2）。
      x-buddy-core-checks: &id001
        - device_token
        - home_network
      responses:
        '200':
          description: 接続情報。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/Bootstrap
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/snapshot:
    get:
      operationId: getSnapshot
      summary: 現在の表示状態
      description: 一つの整合した読取りで状態とイベント位置を返す。ロック中・停止中は再開用の管理情報だけ（07 §2・§4）。
      x-buddy-core-checks: *id001
      parameters:
        - $ref: '#/components/parameters/LockState'
      responses:
        '200':
          description: 表示状態と event_cursor。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/Snapshot
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions:
    post:
      operationId: createSession
      summary: 会話の開始
      description: 保存モードを固定して会話を作る。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。応答の segment_generation は、この会話の発言の origin に使う（ADR 0045・0059）。private の会話はここでは作らない（入口は流れの経路 POST /v1/stream/storage-mode。ADR 0060）。
      x-buddy-core-checks: &id002
        - device_token
        - home_network
        - command_scope
        - unlocked
      parameters:
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/SessionCreateRequest
      responses:
        '201':
          description: 作成した会話。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/SessionReceipt
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/{session_id}/turns:
    post:
      operationId: postTurn
      summary: 画面からの発言
      description: 文字入力と端末内で文字にした声だけ。結果は文字で返し、Live へ送らない。発言から外部変更を直接実行しない（07 §2、10 §6・§6A）。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。origin は端末が見ていた区切り（会話の ID と世代）で、Core が今の区切りと照合する（ADR 0045・0059）。
      x-buddy-core-checks: *id002
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/TurnRequest
      responses:
        '200':
          description: 文字で返す結果。外部変更の完了ではない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/TurnResponse
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/stream/turns:
    post:
      operationId: postStreamTurn
      summary: 流れへの発言
      description: 会話の単位を見せない 1 本の流れへの発言（ADR 0032）。区切り（segment）は Core が選び、要求に会話・区切りの ID と保存モードを持たない。結果は文字とキャンバスの変更の記述で返す。発言から外部変更を直接実行せず、承認・停止をキャンバスに置かない。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks: *id002
      parameters:
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/StreamTurnRequest
      responses:
        '200':
          description: 受けた区切りと、文字とキャンバスの変更の結果。外部変更の完了ではない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/StreamTurnResponse
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/stream/storage-mode:
    get:
      operationId: getStreamStorageMode
      summary: 流れの今の保存モード
      description: 流れの今の保存モード（StreamStorageModeView。UI-05 の段階 6、ADR 0189）。記録しない区切りが開いていれば private、そうでなければ今の区切りの保存モード（まだ区切りがなければ保存境界の保持者のモード）。端末は接続・ロック解除・切り替えの結果が分からないとき・発言の後にこれで読み、状態欄・島・パネルに出す。区切り・会話の ID・世代を返さない。ロック中・不明は 403。読み取りだけで何も変えない。
      x-buddy-core-checks:
        - device_token
        - home_network
        - unlocked
      parameters:
        - $ref: '#/components/parameters/LockState'
      responses:
        '200':
          description: 流れの今の保存モード。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/StreamStorageModeView
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: postStreamStorageMode
      summary: 保存モードの切り替え
      description: 流れの保存モード（normal・extended・private）を切り替え、区切りを開き直す（U170、ADR 0060）。private へ入る・出るもこの経路だけを使い、POST /v1/sessions の private は受け付けない（503）。端末は会話・区切りの ID を送らない（UI-01）。世代を書けないときは 503（入れない・出られない・切り替わらない）、遷移の規則の拒否は 409。成功したら区切りを新しい保存モードと理由（storage_mode_changed・private_started・private_ended）で差し替え、private の出入りでは要約をつながない。同じ request_id の再送は同じ結果を返し、内容が違えば 409（07 §3）。本人の画面操作だけ（Buddy-Input-Origin が screen。音声・チャット・システムの起点では 403。UI-05 の段階 6、ADR 0189）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
      parameters:
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/StorageModeChangeRequest
      responses:
        '200':
          description: 切り替えた後の区切り。保存モードと、区切りを始めた理由を返す。外部変更の完了ではない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/StorageModeChangeResponse
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/canvas:
    get:
      operationId: getCanvas
      summary: キャンバスの今の記述
      description: 流れのキャンバスの今の記述（CanvasDocument。ADR 0032）。正本は中枢で、端末はイベントの購読で届く canvas の知らせ（版だけ）を受けたときと、接続・ロック解除のときにこれで取る。記述は参照だけで本文・説明文を含まない。ロック中・不明は 403。読み取りだけで記述を変えない。
      x-buddy-core-checks:
        - device_token
        - home_network
        - unlocked
      parameters:
        - $ref: '#/components/parameters/LockState'
      responses:
        '200':
          description: キャンバスの今の記述。まだ何も置いていなければ版 0 の空の記述。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CanvasDocument
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/canvas/user-ops:
    post:
      operationId: postCanvasUserOp
      summary: キャンバスのユーザーの操作の記録
      description: 本人がキャンバスの物を動かす・大きさを変える・閉じる・棚へ片付ける・棚から出した操作を記録し、記述に当てて版を 1 進める（CanvasUserOpRequest。UI-06、ADR 0032）。動かす・大きさを変えるはユーザーの置き場所（格子のマス）として持ち、AI の次の束が置き直してよい（AI が優先）。記録は次の配置者の入力になる。expected_canvas_revision が今と同じか、古くてもその物の置き場所・存在がその版より後に変わっていなければ当て、それ以外（物がない・今より新しい版・見える数の上限）は 409（conflict）で捨てる。同じ request_id と同じ内容の再送は保存済みの同じ結果を返し、内容が違えば 409。承認・停止とは別の経路で、外部変更を起こさない。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
      parameters:
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/CanvasUserOpRequest
      responses:
        '200':
          description: 操作を当てた後のキャンバスの版。記述は getCanvas で取る。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CanvasUserOpResponse
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/canvas/content:
    post:
      operationId: postCanvasContent
      summary: キャンバスの物の中身の読み取り
      description: キャンバスの物 1 つの中身（行・セル・予定・メールの件名・出典など。CanvasContent。UI-07、ADR 0032）を許可範囲内で返す。記述（getCanvas）は参照だけで本文を持たないので、端末は描くときにこれで取る。読み取りだけで記述も外部の状態も変えず、イベントの記録に入れない。expected_canvas_revision が今と同じでなければ 409（中身と参照の位置がずれるため。端末は記述を取り直す）。物がない・open_index が範囲外・mail_card 以外で開く指定は 409。中身は物の部品に合った形で、行は物の item_refs と同じ順・同じ件数で返し、中枢の識別子を含まない。メールの本文は open_index の 1 通だけ。UI-07 の中身は模擬の合成データで、実データの取得は B08・B09・B11。ロック中・不明は 403。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
      parameters:
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/CanvasContentRequest
      responses:
        '200':
          description: 物の中身。端末のメモリーだけに置き、保存しない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CanvasContentResponse
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/{session_id}/handoff:
    post:
      operationId: handoffSession
      summary: 表示の移動
      description: 呼び出した端末へ表示を移す。旧端末の退避か期限切れを確認するまで moving。承認は取り直さない（07 §2・§5）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/HandoffRequest
      responses:
        '202':
          description: 移動の状態。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/HandoffState
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}:
    get:
      operationId: getOperation
      summary: 操作の現在の状態
      description: 現在の内容版・状態版・承認状態・結果と、表示補助の allowed_actions を返す。過去の命令の受付結果とは別（07 §2）。
      x-buddy-core-checks: *id001
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: 現在値。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/OperationSnapshot
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/preview:
    post:
      operationId: previewOperation
      summary: 承認表示の準備
      description: 外部変更なし。preview は端末・接続・表示内容に結び付け、接続終了・ロック・表示権の喪失・内容変更で無効にする（07 §2・§3）。
      x-buddy-core-checks: *id002
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/PreviewRequest
      responses:
        '200':
          description: 確定した内容と hash。承認ではない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/OperationPreview
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/display:
    post:
      operationId: displayOperation
      summary: 操作の内容の表示用の読み取り
      description: 読み取りだけ。確定した内容と表示用の値を、preview_id なしで返す（preview は発行せず、承認にも使えない）。取消・再試行の確認に出す見出しを、承認待ち以外の状態でも取り直すために使う。認可は preview と同じ（07 §2）。内容はこの応答だけで、イベント・スナップショットには入れない。
      x-buddy-core-checks: *id002
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/PreviewRequest
      responses:
        '200':
          description: 確定した内容と表示用の値。承認ではない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/OperationDisplay
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/approve:
    post:
      operationId: approveOperation
      summary: 承認
      description: 登録済み・ロック解除済み端末の画面操作だけ。preview_id・content_version・content_hash・expected_state_revision を照合する。202 は受付で、外部変更の成功ではない。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/ApprovalRequest
      responses:
        '202':
          description: 受付または durable の記録。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CommandReceipt
