      summary: レシートの写真 1 枚の読み取り
      description: 本人がロック解除済みの画面で選んだレシートの写真 1 枚（端末が縮めた JPEG）を、外部のモデルの画像の読み取りへ 1 回だけ送り、手入力の欄に入れる値の候補を返す（ADR 0177）。設定が切なら 403 external_send_consent_required で送らない。画像の形式・バイト数・長い辺が上限を超えれば 422。同じ request_id・読み取り中の二つ目は 409 で送らない。外部へ送る前に止めた（予算の門が予約できなかった・保存期限の掃除の途中・本人のタイムゾーンの今日が決まらない・読み取りの口がない・送出意図の前に端末が切断した・要求が届いてから送出意図までの期限 10 秒を過ぎた）ときは 503 not_sent（外部へ送っていない・費用はかからない）、結果が分からない（送ったか・応答が届いたか分からない）ときは 503 dependency_unavailable で、どちらも自動では送り直さない。画像に付帯情報（APP1 の Exif・XMP、APP11、APP13、コメント、画像の終わりの後ろのバイト列）があれば 422 で送らない。端末はこの要求だけ 150 秒まで応答を待ち、中枢は要求が届いてから送り始めるまで 10 秒・読み取りの期限 60 秒以内に終える。予算を予約できなければ 422 budget_held。画像と読み取りの結果は保存しない。応答は信用しない入力として、家計の記録の検査で確かめ直す。結果は記録ではなく、記録は本人が手入力の欄で「足す」を押したときだけ作る。
