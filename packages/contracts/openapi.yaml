      description: 中枢の画面（ロック解除済み・hub_local の端末・中枢と同じマシン）だけ。今の中枢の証明書で始めたペアリングの、期限の前の pending の申請を申請の時刻の順に返す。コード・申請用の秘密・その hash を返さない。claim_check は端末の画面に出る確認コードと同じ値（B03-06、ADR 0026）。
