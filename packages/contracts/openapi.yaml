        - screen_operation
      parameters:
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      responses:
        '200':
          description: 記憶の一覧と忘却の公開ゲートの値。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/MemoryListResponse
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
