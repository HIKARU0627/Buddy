              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/ForgetPlanView
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/memory/forget-plans/{plan_id}/execute:
    post:
      operationId: executeForgetPlan
      summary: 本人が確かめた忘却の計画の実行
      description: 本人がロック解除済みの画面で確かめた忘却の計画を実行する（B06-07b-2、ADR 0180）。中枢は計画を作り直さず、DB の今の系譜で作り直した計画と同じかを 1 つの transaction の中で照合してから、台帳への追記・物理削除・送出禁止の印を書く。台帳の世代が変わった・系譜が増えた・計画が無効（期限切れ・別の端末の計画・実行の途中で結果が分からなくなった）・本文の世代が計画と違うときは何も消さずに 409 で、端末は計画を取り直して本人に見せ直す（自動では作り直して実行しない）。同じ計画の実行の再送には同じ結果を返す。忘却の公開ゲート（U112）が閉じている間・結果が分からないときは 503 で、自動では送り直さない。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
      parameters:
        - $ref: '#/components/parameters/ForgetPlanId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/ForgetExecuteRequest
      responses:
        '200':
          description: 適用した忘却の台帳の世代。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/ForgetExecuteResult
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/forget-ledger/sync:
    post:
      operationId: getForgetLedgerEntries
      summary: 忘却台帳の端末への配信
      description: 登録済みの端末が最後に保存できた忘却台帳の head（系譜・世代・entry_hash）を送り、中枢の台帳（DB が正本）の続きを最大 256 件受け取る（B06-07b-2、端末側の保存は #179。ADR 0180）。台帳は本文・生の元サービス ID を持たないので、ロック中でも返す。端末の複製が中枢の台帳の続きでなければ diverged、端末が中枢より新しい世代を持てば replica_ahead を返し、どちらも項目を返さない。読み取りだけで、忘却の公開ゲートには関わらない。中枢の台帳が読めない・連鎖が欠けているときは 503。
      x-buddy-core-checks:
        - device_token
        - home_network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/ForgetLedgerSyncRequest
      responses:
        '200':
          description: 台帳の続きか、続きを返せない理由。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/ForgetLedgerDelta
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: 登録端末トークン（256 ビット、base64url の 43 文字）。中枢はトークンの ASCII の SHA-256 で登録端末を引き、トークンそのものを保存しない（ADR 0020）。device_id は認証結果から中枢が決め、本文の端末 ID では処理しない。Renderer へ公開しない（07 §2、02）。
  parameters:
    OperationId:
      name: id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 操作 ID。
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 会話 ID。
    LiveSessionId:
      name: live_session_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: Live の接続 ID。
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: ペアリングの申請 ID。
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 端末 ID。
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 連携の接続 ID。
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 超過枠の承認の ID。
    ReservationId:
      name: reservation_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 予算の予約の ID。
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 気づき（候補）の ID。
    HouseholdMonth:
      name: month
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/YearMonth
      description: 家計簿の月（YYYY-MM）。
    HouseholdEntryId:
      name: entry_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 家計の記録の ID。
    HouseholdBillId:
      name: bill_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 請求予定の ID（ADR 0179）。
    ForgetPlanId:
      name: plan_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 忘却の計画の ID（ADR 0180）。計画を求めた端末の計画だけを実行できる。
    Cursor:
      name: cursor
      in: query
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/EventCursor
      description: 中枢が発行した不透明なイベント位置。秘密や認証情報ではない。
    InputOrigin:
      name: Buddy-Input-Origin
      in: header
      required: true
      schema:
        type: string
        enum:
          - screen
          - voice
          - system
          - chat
      description: 要求の起点。Electron main が限定 IPC の種類から付け、screen 以外は画面操作が必要な経路で 403。Renderer が任意に指定できない。chat はブリッジ（中枢と同じマシンの窓口、ADR 0143）が本人のチャットの指示を中継するときだけ付け、受理するのは候補の状態の変更（user_operation）だけ。他の経路では screen とみなさない。
    LockState:
      name: Buddy-Lock-State
      in: header
      required: false
      schema:
        type: string
        enum:
          - unlocked
          - locked
      description: 端末の main が OS から得たロック状態の申告（B03-05、ADR 0025）。ロック解除を求める経路（x-buddy-core-checks の unlocked）と getSnapshot の表示の範囲に使う。端末トークンで認証した要求の申告だけを使い、申告がない（端末で取得できない unknown を含む）ときは解除済みと扱わない（07 §2）。Renderer が任意に指定できない。値が列挙にない場合はどの経路でも 422。
  responses:
    Unauthenticated:
      description: 端末トークン・申請用の秘密がない、無効、または失効している（unauthenticated）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Forbidden:
      description: 自宅判定の不成立（outside_home_network。自宅の指紋の一致と Tailscale の直接経路が自宅 LAN の中にあることの両方が要り、確認できないときも含む。認証済みの端末なら接続範囲を失効させ WSS を閉じる。ADR 0022）、ロック中・ロック状態不明（device_locked）、画面操作でない（screen_operation_required）、中枢の画面でない（hub_screen_required）、音声所有権がない（audio_ownership_required）、対象権限の不足（forbidden）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Conflict:
      description: 内容または状態が変わった（conflict）、同じ request_id を異なる内容で再利用した（conflict）、別の端末が音声を持つ（audio_owned_elsewhere）、記録しない会話中（private_conversation）、取り消す対象がその後に変わった（target_changed）。最新状態を読み直す。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Gone:
      description: 古い接続範囲・表示情報（expired_scope）、取り消し期限の経過（undo_expired）、ペアリングの無効・使用済み（pairing_failed）。古い命令を自動再実行しない。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    PayloadTooLarge:
      description: 制御 JSON の上限（認証後 256 KiB、認証前 16 KiB）を超えた（payload_too_large）。切り詰めずに拒否する。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Unprocessable:
      description: 形式の不正（invalid_input）、予算の保留（budget_held）、未対応の API 版（unsupported_api_version）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    RateLimited:
      description: 頻度制限（rate_limited）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Unavailable:
      description: 中枢・依存先の保留（dependency_unavailable）。忘却の実行（executeForgetPlan）だけ、確定の成否が分からないときは outcome_unknown（計画は残っておらず、消えた可能性がある。自動では送り直さない。ADR 0180）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
