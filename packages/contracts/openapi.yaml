          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: claimPairing
      summary: 登録の申請（認証前）
      description: 端末が指紋を照合した後に送る。認証前のため上限を小さくし、メールや会話を返さない。コードの不一致は残り回数を減らし、無効になったら 410（pairing_failed）（02）。不一致・期限切れ・回数の上限・使用済みの区別は外へ出さず、どれも 410（pairing_failed）にする（ADR 0009・0021）。自宅判定は本文の home_fingerprint と接続元の Tailscale の直接経路で行う（ADR 0022）。
      x-buddy-core-checks:
        - home_network
