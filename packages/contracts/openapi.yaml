openapi: 3.1.2
info:
  title: Buddy Core HTTP API (B00)
  version: 1.0.0
  description: 設計 07 §2 の経路と、端末の登録・失効・連携の接続（U10、ADR 0009）。形式は OpenAPI と JSON Schema が正本で、認証・自宅判定・接続範囲・ロック・画面操作・音声所有権・版の検査は x-buddy-core-checks の順に Core が行う（domain の api.ts）。対象の存在・所有・状態遷移の可否はその後に domain の各規則で判定する。サーバー実装・DB transaction は未実装。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security:
  - deviceToken: []
paths:
  /v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: 接続情報の取得
      description: 認証後に API 版・端末能力・DB 世代・中枢の起動 ID・接続範囲・入出力の状態を返す。本文は含めない。端末は api_version の major が合わなければ使わない（07 §2）。
      x-buddy-core-checks: &id001
        - device_token
        - home_network
      responses:
        '200':
          description: 接続情報。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/Bootstrap
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/snapshot:
    get:
      operationId: getSnapshot
      summary: 現在の表示状態
      description: 一つの整合した読取りで状態とイベント位置を返す。ロック中・停止中は再開用の管理情報だけ（07 §2・§4）。
      x-buddy-core-checks: *id001
      parameters:
        - $ref: '#/components/parameters/LockState'
      responses:
        '200':
          description: 表示状態と event_cursor。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/Snapshot
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions:
    post:
      operationId: createSession
      summary: 会話の開始
      description: 保存モードを固定して会話を作る。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks: &id002
        - device_token
        - home_network
        - command_scope
        - unlocked
      parameters:
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/SessionCreateRequest
      responses:
        '201':
          description: 作成した会話。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/SessionReceipt
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/{session_id}/turns:
    post:
      operationId: postTurn
      summary: 画面からの発言
      description: 文字入力と端末内で文字にした声だけ。結果は文字で返し、Live へ送らない。発言から外部変更を直接実行しない（07 §2、10 §6・§6A）。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks: *id002
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/TurnRequest
      responses:
        '200':
          description: 文字で返す結果。外部変更の完了ではない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/TurnResponse
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/{session_id}/handoff:
    post:
      operationId: handoffSession
      summary: 表示の移動
      description: 呼び出した端末へ表示を移す。旧端末の退避か期限切れを確認するまで moving。承認は取り直さない（07 §2・§5）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/HandoffRequest
      responses:
        '202':
          description: 移動の状態。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/HandoffState
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}:
    get:
      operationId: getOperation
      summary: 操作の現在の状態
      description: 現在の内容版・状態版・承認状態・結果と、表示補助の allowed_actions を返す。過去の命令の受付結果とは別（07 §2）。
      x-buddy-core-checks: *id001
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: 現在値。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/OperationSnapshot
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/preview:
    post:
      operationId: previewOperation
      summary: 承認表示の準備
      description: 外部変更なし。preview は端末・接続・表示内容に結び付け、接続終了・ロック・表示権の喪失・内容変更で無効にする（07 §2・§3）。
      x-buddy-core-checks: *id002
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/PreviewRequest
      responses:
        '200':
          description: 確定した内容と hash。承認ではない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/OperationPreview
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/display:
    post:
      operationId: displayOperation
      summary: 操作の内容の表示用の読み取り
      description: 読み取りだけ。確定した内容と表示用の値を、preview_id なしで返す（preview は発行せず、承認にも使えない）。取消・再試行の確認に出す見出しを、承認待ち以外の状態でも取り直すために使う。認可は preview と同じ（07 §2）。内容はこの応答だけで、イベント・スナップショットには入れない。
      x-buddy-core-checks: *id002
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/PreviewRequest
      responses:
        '200':
          description: 確定した内容と表示用の値。承認ではない。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/OperationDisplay
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/approve:
    post:
      operationId: approveOperation
      summary: 承認
      description: 登録済み・ロック解除済み端末の画面操作だけ。preview_id・content_version・content_hash・expected_state_revision を照合する。202 は受付で、外部変更の成功ではない。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/ApprovalRequest
      responses:
        '202':
          description: 受付または durable の記録。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CommandReceipt
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/cancel:
    post:
      operationId: cancelOperation
      summary: 取消の要求
      description: 送出前だけ取消を確定できる。送出後は照合へ回し、取消済みと表示しない（07 §2、08 §3）。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/StateCommand
      responses:
        '202':
          description: 受付または durable の記録。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CommandReceipt
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/reconcile:
    post:
      operationId: reconcileOperation
      summary: 照合の要求
      description: 参照による照合だけ。書込みを増やさない（07 §2）。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/StateCommand
      responses:
        '202':
          description: 受付または durable の記録。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CommandReceipt
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{id}/retry:
    post:
      operationId: retryOperation
      summary: 再試行の要求
      description: 未実行が確定した同じ変更への本人の明示操作だけ。結果不明の自動再送はしない（07 §2）。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/StateCommand
      responses:
        '202':
          description: 受付または durable の記録。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CommandReceipt
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auto-actions:
    get:
      operationId: listAutoActions
      summary: 自動実行の一覧
      description: 自動実行した操作と取り消しの可否、安全停止の状態（07 §2、J12）。本文は含めない。
      x-buddy-core-checks: *id001
      responses:
        '200':
          description: 一覧。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/AutoActionList
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auto-actions/{id}/undo:
    post:
      operationId: undoAutoAction
      summary: 自動実行の取り消し
      description: 登録済み・ロック解除済み端末の画面操作だけ。補償操作を新しい operation_id で受け付ける。対象がその後に変わっていれば 409（target_changed）で自動では戻さない。完了から 30 日を過ぎたら 410（undo_expired）（07 §2、J12）。request_id・接続範囲・同じ内容の再送は保存済みの同じ受付結果を返し、内容が違えば 409（07 §3）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/OperationId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/StateCommand
      responses:
        '202':
          description: 補償操作の受付。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/CommandReceipt
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/safety/resume:
    post:
      operationId: resumeSafety
      summary: 安全停止の解除
      description: 登録済み・ロック解除済み端末の画面操作だけ。解除した本人操作を記録する（07 §2）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/SafetyResumeRequest
      responses:
        '200':
          description: 解除後の状態。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/SafetyState
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/io/stop:
    post:
      operationId: stopIo
      summary: 入出力の停止
      description: 端末単位・来客・全体の停止。端末はローカルで先に止め、この要求の応答を待たない。停止と外部操作の取消は別（07 §2・§5）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/IoStopRequest
      responses:
        '202':
          description: 停止の到達状況。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/IoStopResult
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/io/resume:
    post:
      operationId: resumeIo
      summary: 入出力の再開
      description: 登録済み・ロック解除済み端末の画面操作だけ。接続復帰・ロック解除・呼びかけだけでは再開しない（07 §2、10 §1A）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/IoResumeRequest
      responses:
        '200':
          description: 再開後の入出力の状態。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/DeviceIOState
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
