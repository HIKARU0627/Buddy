        - device_token
        - home_network
        - unlocked
        - hub_screen
      parameters:
        - $ref: '#/components/parameters/LockState'
      responses:
        '200':
          description: 承認待ちの申請。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/PairingClaimList
