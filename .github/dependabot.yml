version: 2
updates:
  # GitHub uses the npm ecosystem identifier for pnpm as well.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8.71.2 requires TypeScript <6.1.0.
      # Revisit this ceiling together with the lint toolchain.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Keep Node types aligned with the Node 24 runtime in package.json / CI.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
    groups:
      development-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
