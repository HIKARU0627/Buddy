# 1 つの OS の全検査。ci.yml が OS ごとに呼び出し、試験を shard に分けて並列に実行する。
# `pnpm run check` の検査はすべて、この OS のどれかの shard で行う（shard 1 が静的検査、全 shard がビルドと試験の一部）。
name: Verify OS

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

permissions:
  contents: read

jobs:
  shard:
    name: Shard ${{ matrix.shard }}/${{ strategy.job-total }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check environment
        run: pnpm run doctor
      # ここから shard 1 だけ: OS ごとに 1 回行う静的検査（format・契約・lint）。
      - name: Check formatting
        if: matrix.shard == 1
        run: pnpm run format:check
      - name: Check contracts
        if: matrix.shard == 1
        run: pnpm run contracts:check
      - name: Lint
        if: matrix.shard == 1
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Typecheck
        if: matrix.shard == 1
        run: pnpm run typecheck
      - name: Check public content
        if: matrix.shard == 1
        run: pnpm run security:check
      - name: Verify local secret-scanning tool
        if: matrix.shard == 1
        run: pnpm run security:setup
      - name: Check staged snapshot
        if: matrix.shard == 1
        run: pnpm run security:staged
      - name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # 通常の PR の CI でも、macOS の既存 shard 2（B07）・shard 3（B04）・shard 4（B05）だけで模擬証拠を作る。
        # POSIX のファイル権限の観測を含むため macOS だけで生成し、他の OS では空にして保存しない。
        # 生成物は artifact にだけ残し、commit しない。strict な照合は evidence:check（必須チェックとは別）。
        env:
          BUDDY_B04_EVIDENCE_PATH: "${{ runner.os == 'macOS' && format('{0}/evidence-b04-simulated.json', runner.temp) || '' }}"
          BUDDY_B05_EVIDENCE_PATH: "${{ runner.os == 'macOS' && format('{0}/evidence-b05-simulated.json', runner.temp) || '' }}"
          BUDDY_B07_EVIDENCE_PATH: "${{ runner.os == 'macOS' && format('{0}/evidence-b07-simulated.json', runner.temp) || '' }}"
        run: node scripts/run-tests.mjs --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      # 生成器は全反復が時間内に成功したときだけ書く（tests/integration/evidence-run.mjs）。
      # artifact を取り込んだ PR が format:check で落ちないよう、upload の前に Prettier で整える。
      - name: Format B04 evidence
        if: runner.os == 'macOS' && matrix.shard == 3
        run: pnpm exec prettier --write "${{ runner.temp }}/evidence-b04-simulated.json"
      - name: Format B07 evidence
        if: runner.os == 'macOS' && matrix.shard == 2
        run: pnpm exec prettier --write "${{ runner.temp }}/evidence-b07-simulated.json"
      - name: Format B05 evidence
        if: runner.os == 'macOS' && matrix.shard == 4
        run: pnpm exec prettier --write "${{ runner.temp }}/evidence-b05-simulated.json"
      # ここでは artifact に残す前に、記録の形と実行した commit を確かめる。
      - name: Check generated B04 evidence
        if: runner.os == 'macOS' && matrix.shard == 3
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/evidence-b04-simulated.json
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const path = process.env.EVIDENCE_PATH;
            const evidence = JSON.parse(readFileSync(path, "utf8"));
            if (evidence.status !== "recorded") throw new Error(`${path}: status`);
            if (!Array.isArray(evidence.records) || evidence.records.length === 0) throw new Error(`${path}: records`);
            if (!Array.isArray(evidence.source_sha256) || evidence.source_sha256.length === 0) throw new Error(`${path}: source_sha256`);
            const commits = new Set(evidence.records.map((record) => record.commit));
            if (commits.size !== 1 || !commits.has(process.env.GITHUB_SHA)) throw new Error(`${path}: commit ${[...commits].join(",")} !== ${process.env.GITHUB_SHA}`);
            console.log(`${path}: ${evidence.records.length} records, commit ${process.env.GITHUB_SHA}`);
          '
      - name: Check generated B07 evidence
        if: runner.os == 'macOS' && matrix.shard == 2
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/evidence-b07-simulated.json
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const path = process.env.EVIDENCE_PATH;
            const evidence = JSON.parse(readFileSync(path, "utf8"));
            if (evidence.status !== "recorded") throw new Error(`${path}: status`);
            if (!Array.isArray(evidence.records) || evidence.records.length === 0) throw new Error(`${path}: records`);
            if (!Array.isArray(evidence.source_sha256) || evidence.source_sha256.length === 0) throw new Error(`${path}: source_sha256`);
            const commits = new Set(evidence.records.map((record) => record.commit));
            if (commits.size !== 1 || !commits.has(process.env.GITHUB_SHA)) throw new Error(`${path}: commit ${[...commits].join(",")} !== ${process.env.GITHUB_SHA}`);
            console.log(`${path}: ${evidence.records.length} records, commit ${process.env.GITHUB_SHA}`);
          '
      - name: Check generated B05 evidence
        if: runner.os == 'macOS' && matrix.shard == 4
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/evidence-b05-simulated.json
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const path = process.env.EVIDENCE_PATH;
            const evidence = JSON.parse(readFileSync(path, "utf8"));
            if (evidence.status !== "recorded") throw new Error(`${path}: status`);
            if (!Array.isArray(evidence.records) || evidence.records.length === 0) throw new Error(`${path}: records`);
            if (!Array.isArray(evidence.source_sha256) || evidence.source_sha256.length === 0) throw new Error(`${path}: source_sha256`);
            const commits = new Set(evidence.records.map((record) => record.commit));
            if (commits.size !== 1 || !commits.has(process.env.GITHUB_SHA)) throw new Error(`${path}: commit ${[...commits].join(",")} !== ${process.env.GITHUB_SHA}`);
            console.log(`${path}: ${evidence.records.length} records, commit ${process.env.GITHUB_SHA}`);
          '
      - name: Upload B04 evidence artifact
        if: runner.os == 'macOS' && matrix.shard == 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulated-evidence-b04-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-b04-simulated.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B07 evidence artifact
        if: runner.os == 'macOS' && matrix.shard == 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulated-evidence-b07-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-b07-simulated.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload B05 evidence artifact
        if: runner.os == 'macOS' && matrix.shard == 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulated-evidence-b05-${{ github.sha }}
          path: ${{ runner.temp }}/evidence-b05-simulated.json
          if-no-files-found: error
          retention-days: 30
