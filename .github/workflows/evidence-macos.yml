# B04・B07 の模擬の証拠を macOS で作り、artifact として取り出す（Issue #170、本人の決定 2026-10-31）。
# 証拠には POSIX のファイル権限の観測（他人が書ける設定の拒否）が含まれ、Windows では作れない。
# 通常の CI（ci.yml・verify-os.yml）はこの workflow を呼ばず、証拠を書き換えない。
# 手で実行したときだけ、指定したブランチのソースから証拠を作る。commit・push はしない。
name: Simulated evidence (macOS)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: B04/B07 evidence (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: B04 evidence
        env:
          BUDDY_B04_EVIDENCE_PATH: tests/integration/evidence-b04-simulated.json
        run: node --test tests/integration/b04.test.mjs
      - name: B07 evidence
        env:
          BUDDY_B07_EVIDENCE_PATH: tests/integration/evidence-b07-simulated.json
        run: node --test tests/integration/b07.test.mjs
      - name: Format evidence
        run: >-
          pnpm exec prettier --write
          tests/integration/evidence-b04-simulated.json
          tests/integration/evidence-b07-simulated.json
      - name: Check evidence
        run: |
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            import { readFileSync } from "node:fs";
            const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            for (const path of [
              "tests/integration/evidence-b04-simulated.json",
              "tests/integration/evidence-b07-simulated.json",
            ]) {
              const evidence = JSON.parse(readFileSync(path, "utf8"));
              if (evidence.status !== "recorded") throw new Error(`${path}: status`);
              if (!Array.isArray(evidence.records) || evidence.records.length === 0) throw new Error(`${path}: records`);
              if (!Array.isArray(evidence.source_sha256) || evidence.source_sha256.length === 0) throw new Error(`${path}: source_sha256`);
              const commits = new Set(evidence.records.map((record) => record.commit));
              if (commits.size !== 1 || !commits.has(head)) throw new Error(`${path}: commit ${[...commits].join(",")} !== ${head}`);
              console.log(`${path}: ${evidence.records.length} records, commit ${head}`);
            }
          '
      - name: Write summary
        run: |
          {
            echo "## Simulated evidence (macOS)"
            echo ""
            echo "- ref: \`$GITHUB_REF\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- artifact: \`simulated-evidence-$GITHUB_SHA\`"
            echo ""
            echo "B04・B07 の証拠を macOS で作りました。artifact を取得し、作業ブランチの \`tests/integration/\` へ取り込んでください。"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulated-evidence-${{ github.sha }}
          path: |
            tests/integration/evidence-b04-simulated.json
            tests/integration/evidence-b07-simulated.json
          if-no-files-found: error
          retention-days: 30
