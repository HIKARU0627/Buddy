        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/connections/{connection_id}/targets:
    put:
      operationId: updateConnectionTargets
      summary: 取得対象の変更
      description: 本人が選んだ対象だけに変える。許可版と取得範囲の版を上げ、旧範囲の走査を無効にする（04、11 §1A）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/ConnectionTargetsRequest
      responses:
        '200':
          description: 変更後の接続。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/ConnectionSummary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/connections/{connection_id}/disconnect:
    post:
      operationId: disconnectConnection
      summary: 接続の解除
      description: 取得と自動処理を止める。進行中の操作の照合に必要な最小情報は残す（01、04）。
      x-buddy-core-checks:
        - device_token
        - home_network
        - command_scope
        - unlocked
        - screen_operation
        - expected_revision
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/InputOrigin'
        - $ref: '#/components/parameters/LockState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/buddy.schema.json#/$defs/ConnectionDisconnectRequest
      responses:
        '200':
          description: 解除後の接続。
          content:
            application/json:
              schema:
                $ref: ./schemas/buddy.schema.json#/$defs/ConnectionSummary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: 登録端末トークン（256 ビット、base64url の 43 文字）。中枢はトークンの ASCII の SHA-256 で登録端末を引き、トークンそのものを保存しない（ADR 0020）。device_id は認証結果から中枢が決め、本文の端末 ID では処理しない。Renderer へ公開しない（07 §2、02）。
  parameters:
    OperationId:
      name: id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 操作 ID。
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 会話 ID。
    LiveSessionId:
      name: live_session_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: Live の接続 ID。
    ClaimId:
      name: claim_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: ペアリングの申請 ID。
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 端末 ID。
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/Id
      description: 連携の接続 ID。
    Cursor:
      name: cursor
      in: query
      required: true
      schema:
        $ref: ./schemas/buddy.schema.json#/$defs/EventCursor
      description: 中枢が発行した不透明なイベント位置。秘密や認証情報ではない。
    InputOrigin:
      name: Buddy-Input-Origin
      in: header
      required: true
      schema:
        type: string
        enum:
          - screen
          - voice
          - system
      description: 要求の起点。Electron main が限定 IPC の種類から付け、screen 以外は画面操作が必要な経路で 403。Renderer が任意に指定できない。
    LockState:
      name: Buddy-Lock-State
      in: header
      required: false
      schema:
        type: string
        enum:
          - unlocked
          - locked
      description: 端末の main が OS から得たロック状態の申告（B03-05、ADR 0025）。ロック解除を求める経路（x-buddy-core-checks の unlocked）と getSnapshot の表示の範囲に使う。端末トークンで認証した要求の申告だけを使い、申告がない（端末で取得できない unknown を含む）ときは解除済みと扱わない（07 §2）。Renderer が任意に指定できない。値が列挙にない場合はどの経路でも 422。
  responses:
    Unauthenticated:
      description: 端末トークン・申請用の秘密がない、無効、または失効している（unauthenticated）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Forbidden:
      description: 自宅判定の不成立（outside_home_network。自宅の指紋の一致と Tailscale の直接経路が自宅 LAN の中にあることの両方が要り、確認できないときも含む。認証済みの端末なら接続範囲を失効させ WSS を閉じる。ADR 0022）、ロック中・ロック状態不明（device_locked）、画面操作でない（screen_operation_required）、中枢の画面でない（hub_screen_required）、音声所有権がない（audio_ownership_required）、対象権限の不足（forbidden）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Conflict:
      description: 内容または状態が変わった（conflict）、同じ request_id を異なる内容で再利用した（conflict）、別の端末が音声を持つ（audio_owned_elsewhere）、記録しない会話中（private_conversation）、取り消す対象がその後に変わった（target_changed）。最新状態を読み直す。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Gone:
      description: 古い接続範囲・表示情報（expired_scope）、取り消し期限の経過（undo_expired）、ペアリングの無効・使用済み（pairing_failed）。古い命令を自動再実行しない。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    PayloadTooLarge:
      description: 制御 JSON の上限（認証後 256 KiB、認証前 16 KiB）を超えた（payload_too_large）。切り詰めずに拒否する。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Unprocessable:
      description: 形式の不正（invalid_input）、予算の保留（budget_held）、未対応の API 版（unsupported_api_version）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    RateLimited:
      description: 頻度制限（rate_limited）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
    Unavailable:
      description: 中枢・依存先の保留（dependency_unavailable）。
      content:
        application/json:
          schema:
            $ref: ./schemas/buddy.schema.json#/$defs/ApiError
